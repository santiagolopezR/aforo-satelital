<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aforo satelital</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --fondo: #f5f6f2; --panel: #ffffff; --texto: #1f2a1c; --suave: #66705f;
    --borde: #dfe3d8; --acento: #3d7a2a; --aviso-fondo: #fff4d6; --aviso-texto: #7a5800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #141813; --panel: #1d231b; --texto: #e6ebe1; --suave: #9aa592;
      --borde: #2e372b; --acento: #7cc061; --aviso-fondo: #3a3010; --aviso-texto: #f2d27a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  header { padding: 14px 16px 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--suave); font-size: 13px; }
  .aviso { margin: 8px 16px; padding: 8px 12px; border-radius: 8px; background: var(--aviso-fondo); color: var(--aviso-texto); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 12px; padding: 8px 16px 16px; }
  #mapa { height: calc(100vh - 150px); min-height: 380px; border-radius: 10px; border: 1px solid var(--borde); }
  #lado { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow: auto; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .tarjeta.activa { outline: 2px solid var(--acento); }
  .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .nombre { font-weight: 600; }
  .valor { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .unidad { font-size: 12px; color: var(--suave); font-weight: 400; }
  .meta { color: var(--suave); font-size: 12px; }
  .viejo { color: var(--aviso-texto); }
  .punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #detalle { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; display: none; }
  #detalle h2 { font-size: 16px; margin: 0 0 4px; }
  svg text { fill: var(--suave); font-size: 10px; }
  .leyenda { background: var(--panel); color: var(--texto); padding: 6px 8px; border-radius: 6px; font-size: 12px; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 4px; border-bottom: 1px solid var(--borde); text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .boton { display: block; text-align: center; margin: 10px 0 4px; padding: 10px; border-radius: 8px; background: var(--acento); color: var(--panel); font-weight: 600; text-decoration: none; }
  .aforo-txt { color: #2b6cb0; }
  @media (prefers-color-scheme: dark) { .aforo-txt { color: #7fb3f0; } }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #mapa { height: 55vh; }
    #lado { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Aforo satelital de potreros</h1>
  <div class="sub" id="actualizado">Cargando…</div>
</header>
<div class="aviso" id="aviso">Modelo provisional <b>sin calibrar</b> (Sentinel-2, NDVI). Los kilos son orientativos hasta cargar aforos de campo.</div>
<main>
  <div id="mapa"></div>
  <div id="lado">
    <div id="detalle"></div>
    <div id="lista"></div>
  </div>
</main>
<script>
const ESCALA = [[0, "#b2182b"], [0.5, "#ef8a62"], [1.0, "#fddb6d"], [1.5, "#a6d96a"], [2.5, "#4dac26"], [3.5, "#1b7837"]];
const color = v => v == null ? "#888" : ESCALA.reduce((c, [lim, col]) => v >= lim ? col : c, ESCALA[0][1]);
const fmt = (v, d = 2) => v == null ? "—" : v.toLocaleString("es-CO", { maximumFractionDigits: d, minimumFractionDigits: d });
const diasDesde = f => f ? Math.round((Date.now() - new Date(f + "T12:00:00")) / 864e5) : null;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const mapa = L.map("mapa");
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, maxNativeZoom: 17, attribution: "Imágenes © Esri"
}).addTo(mapa);

const leyenda = L.control({ position: "bottomleft" });
leyenda.onAdd = () => {
  const d = L.DomUtil.create("div", "leyenda");
  d.innerHTML = "<b>kg FV/m²</b><br>" + ESCALA.map(([l, c], i) =>
    `<span class="punto" style="background:${c}"></span>${l}${ESCALA[i + 1] ? "–" + ESCALA[i + 1][0] : "+"}`).join("<br>");
  return d;
};
leyenda.addTo(mapa);

let capas = {}, activo = null;
const REPO = location.hostname.endsWith("github.io")
  ? `https://github.com/${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`
  : "https://github.com/santiagolopezR/aforo-satelital";
const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const enlaceAforo = nombre => `${REPO}/issues/new?template=aforo.yml&title=${encodeURIComponent("Aforo " + nombre)}`
  + `&potrero=${encodeURIComponent(nombre)}&fecha=${hoyISO()}`;
const AZUL = "#2b6cb0";

function grafica(serie, aforos) {
  const fechas = [...serie.map(s => s.f), ...aforos.map(a => a.f)].sort();
  if (fechas.length < 2) return '<div class="meta">Aún no hay suficientes fechas para graficar.</div>';
  const W = 350, H = 150, m = { l: 30, r: 8, t: 8, b: 22 };
  const t0 = new Date(fechas[0]), t1 = new Date(fechas[fechas.length - 1]);
  const val = s => s.aj ?? s.fv;
  const maxV = Math.max(1, ...serie.map(s => Math.max(s.fv, val(s))), ...aforos.map(a => a.kg)) * 1.1;
  const x = f => m.l + (new Date(f) - t0) / Math.max(1, t1 - t0) * (W - m.l - m.r);
  const y = v => H - m.b - v / maxV * (H - m.t - m.b);
  const linea = (fn, extra) => serie.length > 1
    ? `<polyline points="${serie.map(s => `${x(s.f).toFixed(1)},${y(fn(s)).toFixed(1)}`).join(" ")}" fill="none" ${extra}/>` : "";
  const hayAjuste = serie.some(s => s.aj != null);
  const marcas = [0, maxV / 2, maxV].map(v =>
    `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="${m.l - 4}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`).join("");
  const puntos = serie.map(s => `<circle cx="${x(s.f)}" cy="${y(val(s))}" r="3" fill="${color(val(s))}"><title>${s.f}: ${fmt(val(s))} kg FV/m²${s.aj != null ? " (satélite " + fmt(s.fv) + ")" : ""}</title></circle>`).join("");
  const rombos = aforos.map(a => { const cx = x(a.f), cy = y(a.kg);
    return `<path d="M${cx} ${cy - 5}L${cx + 5} ${cy}L${cx} ${cy + 5}L${cx - 5} ${cy}Z" fill="${AZUL}"><title>Aforo ${a.f}: ${fmt(a.kg)} kg FV/m²</title></path>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${marcas}
    ${hayAjuste ? linea(s => s.fv, 'stroke="currentColor" opacity=".35" stroke-width="1.5" stroke-dasharray="4 3"') : ""}
    ${linea(val, 'stroke="var(--acento)" stroke-width="2"')}${puntos}${rombos}
    <text x="${m.l}" y="${H - 6}">${fechas[0]}</text><text x="${W - m.r}" y="${H - 6}" text-anchor="end">${fechas[fechas.length - 1]}</text></svg>
    <div class="meta"><span style="color:var(--acento)">●</span> satélite${hayAjuste ? " (ajustado; punteado = sin ajustar)" : ""} · <span class="aforo-txt">◆ aforo de campo</span></div>`;
}

function mostrar(nombre) {
  activo = nombre;
  document.querySelectorAll(".tarjeta").forEach(t => t.classList.toggle("activa", t.dataset.n === nombre));
  const { feature, capa } = capas[nombre];
  const p = feature.properties;
  mapa.fitBounds(capa.getBounds(), { maxZoom: 17, padding: [30, 30] });
  const filas = [
    ...p.serie_s2.map(s => ({ f: s.f, html: `<td>${s.f}</td><td>${fmt(s.aj ?? s.fv)}${s.aj != null ? "*" : ""}</td><td>${fmt(s.ndvi)}</td><td>${Math.round(s.v * 100)}%</td>` })),
    ...p.aforos.map(a => ({ f: a.f, html: `<td class="aforo-txt">${a.f} ◆</td><td class="aforo-txt">${fmt(a.kg)}</td><td colspan="2" class="aforo-txt" style="text-align:left">aforo · ${esc(a.metodo || "")}</td>` })),
  ].sort((a, b) => b.f.localeCompare(a.f)).slice(0, 14).map(r => `<tr>${r.html}</tr>`).join("");
  const det = document.getElementById("detalle");
  det.style.display = "block";
  det.innerHTML = `<h2>${esc(p.nombre)}</h2>
    <div class="meta">${esc(p.especie_nombre)} · ${fmt(p.area_ha)} ha · ${p.ultima_fecha ? esc(p.fuente) + " del " + p.ultima_fecha : "sin imagen útil todavía"}</div>
    <div class="fila" style="margin:8px 0"><div><span class="valor">${fmt(p.kg_fv_m2)}</span> <span class="unidad">kg FV/m²</span></div>
    <div><span class="valor">${fmt(p.t_fv_potrero, 1)}</span> <span class="unidad">t FV en el potrero</span></div></div>
    ${grafica(p.serie_s2, p.aforos)}
    <a class="boton" href="${enlaceAforo(p.nombre)}" target="_blank" rel="noopener">Registrar aforo de este potrero</a>
    <table><tr><th>Fecha</th><th>kg FV/m²</th><th>NDVI</th><th>Despejado</th></tr>${filas}</table>
    ${p.serie_s2.some(s => s.aj != null) ? '<div class="meta">* corregido con el último aforo de campo</div>' : ""}`;
}

fetch("datos.json", { cache: "no-store" }).then(r => r.json()).then(datos => {
  const act = new Date(datos.actualizado);
  document.getElementById("actualizado").textContent =
    `Actualizado ${act.toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" })} · ${datos.features.length} potreros · ${datos.aforos_total || 0} aforos de campo`;
  if (datos.modelo && datos.modelo.startsWith("calibrado"))
    document.getElementById("aviso").innerHTML = `Modelo <b>${esc(datos.modelo)}</b>. Las demás especies siguen sin calibrar.`;
  if (!datos.features.length) {
    document.getElementById("lista").innerHTML = '<div class="tarjeta">No hay potreros. Sube un archivo .kml, .kmz o .geojson a la carpeta <b>potreros/</b>.</div>';
    mapa.setView([4.6, -74.1], 6);
    return;
  }
  const grupo = L.featureGroup().addTo(mapa);
  for (const f of datos.features) {
    const p = f.properties;
    const capa = L.geoJSON(f, { style: { color: "#fff", weight: 1.5, fillColor: color(p.kg_fv_m2), fillOpacity: 0.55 } })
      .bindTooltip(`${esc(p.nombre)}: ${fmt(p.kg_fv_m2)} kg FV/m²`)
      .on("click", () => mostrar(p.nombre))
      .addTo(grupo);
    capas[p.nombre] = { feature: f, capa };
  }
  mapa.fitBounds(grupo.getBounds(), { padding: [20, 20], maxZoom: 16 });

  const orden = [...datos.features].sort((a, b) => (b.properties.kg_fv_m2 ?? -1) - (a.properties.kg_fv_m2 ?? -1));
  document.getElementById("lista").innerHTML = orden.map(({ properties: p }) => {
    const d = diasDesde(p.ultima_fecha);
    const que = p.fuente === "aforo de campo" ? "aforo" : "imagen";
    const edad = d == null ? "sin imagen útil" : d === 0 ? `${que} de hoy` : `${que} de hace ${d} día${d === 1 ? "" : "s"}`;
    return `<div class="tarjeta" data-n="${esc(p.nombre)}">
      <div class="fila"><span class="nombre"><span class="punto" style="background:${color(p.kg_fv_m2)}"></span>${esc(p.nombre)}</span>
      <span class="valor">${fmt(p.kg_fv_m2)} <span class="unidad">kg FV/m²</span></span></div>
      <div class="meta">${esc(p.especie_nombre)} · ${fmt(p.area_ha)} ha · <span class="${d > 10 ? "viejo" : ""}">${edad}</span></div></div>`;
  }).join("");
  document.querySelectorAll(".tarjeta[data-n]").forEach(t => t.addEventListener("click", () => mostrar(t.dataset.n)));
}).catch(() => {
  document.getElementById("actualizado").textContent = "Todavía no hay datos (datos.json). Corre el proceso una vez.";
});
</script>
</body>
</html>
