name: Aforo satelital

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, 8:00 a. m. hora Colombia
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  issues:
    types: [opened]          # formulario "Registrar aforo de campo"
  push:
    paths:                   # cuando se suben o cambian potreros o el modelo
      - "potreros/**"
      - "config.json"
      - "aforo.py"
      - "aforos_campo/**"
      - "pastoreos/**"
      - "exclusiones/**"
      - ".github/workflows/aforo.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: aforo
  cancel-in-progress: false

jobs:
  aforo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python aforo.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar resultados
        run: |
          git config user.name "aforo-bot"
          git config user.email "aforo-bot@users.noreply.github.com"
          git add data docs/datos.json docs/pixeles docs/arboles.kmz aforos_campo exclusiones pastoreos
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Aforo $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Responder formularios de aforo
        run: python aforo.py --cerrar-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
