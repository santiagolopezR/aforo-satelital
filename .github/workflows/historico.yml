name: Historico para calibrar

on:
  workflow_dispatch:
    inputs:
      finca:
        description: "Finca (id de config.json, p. ej. altos_de_medina)"
        default: "altos_de_medina"
  schedule:
    - cron: "40 */6 * * *"   # sigue donde quedó hasta terminar; luego solo revisa que no falte nada
  push:
    paths:
      - "historico.py"
      - "dataset_ml.py"
      - "entrenar_ml.py"
      - ".github/workflows/historico.yml"

permissions:
  contents: write

concurrency:
  group: aforo
  cancel-in-progress: false

env:
  FINCA: ${{ github.event.inputs.finca || 'altos_de_medina' }}

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mapa al día (crea la máscara de árboles si falta)
        run: python aforo.py
      # Cada paso guarda su registro en data/<finca>/log_*.txt (los registros de GitHub piden iniciar sesión).
      - name: Imágenes Sentinel-2 viejas de las fechas de aforo
        continue-on-error: true
        run: mkdir -p "data/$FINCA" && python historico.py "$FINCA" 140 2>&1 | tee "data/$FINCA/log_historico.txt"
      - name: Tabla para machine learning (todas las bandas, radar, Landsat, clima)
        continue-on-error: true
        run: python dataset_ml.py "$FINCA" 100 2>&1 | tee "data/$FINCA/log_dataset_ml.txt"
      - name: Entrenar y probar modelos
        continue-on-error: true
        run: python entrenar_ml.py "$FINCA" 2>&1 | tee "data/$FINCA/log_entrenar_ml.txt"
      - name: Recalibrar con todo
        run: python aforo.py
      - name: Guardar resultados
        run: |
          git config user.name "aforo-bot"
          git config user.email "aforo-bot@users.noreply.github.com"
          guardar() {
            git add data docs exclusiones aforos_campo pastoreos
            if git diff --cached --quiet; then echo "Sin cambios"; return 0; fi
            git commit -m "Histórico y modelo ML $(date -u +%Y-%m-%d)"
          }
          # Lo que no se puede recalcular rápido se guarda aparte por si hay que partir de lo más nuevo.
          mkdir -p /tmp/guardado
          for a in historial_largo.csv escenas_revisadas.txt historico_estado.json dataset_ml.csv log_historico.txt \
                   log_dataset_ml.txt log_entrenar_ml.txt; do
            cp "data/$FINCA/$a" /tmp/guardado/ 2>/dev/null || true
          done
          cp data/$FINCA/ml_* data/$FINCA/modelo_*.joblib /tmp/guardado/ 2>/dev/null || true
          cp "docs/$FINCA/modelo_ml.json" /tmp/guardado/ 2>/dev/null || true
          guardar
          for intento in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            mkdir -p "data/$FINCA" "docs/$FINCA"
            cp /tmp/guardado/* "data/$FINCA/" 2>/dev/null || true
            mv "data/$FINCA/modelo_ml.json" "docs/$FINCA/" 2>/dev/null || true
            python aforo.py
            guardar
          done
          exit 1
